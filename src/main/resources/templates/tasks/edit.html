
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Редактирование задачи</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-dark text-light">

<div class="container mt-5">

    <h1 class="mb-4">Редактирование задачи</h1>

    <!-- Форма редактирования -->
    <form th:action="@{/tasks/{id}/edit(id=${task.id})}"
          th:object="${task}"
          method="post">

        <div class="mb-3">
            <label class="form-label">Название</label>

            <input type="text"
                   class="form-control"
                   th:field="*{title}">

            <div class="text-danger fs-5 mt-1"
                 th:if="${#fields.hasErrors('title')}"
                 th:errors="*{title}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Описание</label>

            <textarea class="form-control"
                      th:field="*{description}"
                      rows="4"></textarea>

            <div class="text-danger fs-5 mt-1"
                 th:if="${#fields.hasErrors('description')}"
                 th:errors="*{description}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Статус</label>

            <select class="form-select" th:field="*{status}">
                <option value="TODO">К выполнению</option>
                <option value="IN_PROGRESS">В процессе</option>
                <option value="DONE">Выполнено</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Приоритет</label>

            <select class="form-select" th:field="*{priority}">
                <option value="LOW">Низкий</option>
                <option value="MEDIUM">Средний</option>
                <option value="HIGH">Высокий</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Срок выполнения</label>

            <input type="date"
                   class="form-control"
                   th:field="*{dueDate}">
        </div>

        <button type="submit" class="btn btn-primary">
            Сохранить изменения
        </button>

        <a href="/tasks" class="btn btn-secondary">
            Назад
        </a>

    </form>

    <!-- Отдельная форма удаления -->
    <form th:action="@{/tasks/{id}/delete(id=${task.id})}"
          method="post"
          class="mt-3">

        <button type="submit" class="btn btn-danger">
            Удалить задачу
        </button>

    </form>

</div>

</body>
</html>
